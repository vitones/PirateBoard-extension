name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/verificar.mjs

  empacotar:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gerar o ZIP e o SHA-256
        run: |
          v=$(node -p "require('./manifest.json').version")
          mkdir -p dist
          zip -X -r "dist/pirateboard-extensao-$v.zip" manifest.json api.js content.js countries.js i18n.js parse.js popup.html popup.css popup.js icons
          (cd dist && sha256sum "pirateboard-extensao-$v.zip" | tee SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pirateboard-extensao
          path: dist/
          if-no-files-found: error

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.183.0
      # Análise estática gratuita (Semgrep OSS), sem login e sem métricas; falha o job se houver achado.
      - run: semgrep scan --config p/javascript --config p/owasp-top-ten --metrics=off --error --exclude node_modules --exclude dist .
